<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandarinwow · Blink-Blink Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 6px; background: #060414; color: #ffeac2; font-family: 'Segoe UI','Microsoft YaHei',sans-serif; }
    .arena { max-width: 1400px; margin: auto; padding: 22px 24px 26px; border: 3px solid #ffd966a6; border-radius: 36px; background: radial-gradient(circle at 20% 20%,#140e33,#070417); }
    .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px; padding-bottom:12px; border-bottom:2px dashed #ffc85080; }
    h1 { margin:0; font-size:2.8rem; background:linear-gradient(135deg,#ffe9a7,#ffc857,#ff9f1c); color:transparent; background-clip:text; }
    .subtitle { color:#d4c8ff; letter-spacing:3px; font-weight:800; background:#ffd96626; border:1.5px solid #ffd96677; border-radius:40px; padding:8px 20px; }
    .intro { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:18px; padding:14px 22px; border:1.5px solid #ffb34766; border-radius:28px; background:#190f2dd9; font-size:1.35rem; }
    .tabs { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:18px; }
    .tab { border:2px solid #6b59a3; border-radius:60px; padding:12px 26px; background:#1e1436; color:#e6dcff; box-shadow:0 4px 0 #0e081a; cursor:pointer; font-size:1.15rem; font-weight:800; }
    .tab.active { border-color:#fff3b0; background:linear-gradient(145deg,#ffd966,#f7b731); color:#1d0e2e; box-shadow:0 0 24px #ffb347,0 4px 0 #a56b00; }
    .grid { display:grid; grid-template-columns:1.25fr .85fr; gap:20px; }
    .panel { min-height:360px; padding:20px; border:1.5px solid #b491ff55; border-radius:30px; background:#120c28e6; }
    .label { display:flex; justify-content:space-between; margin-bottom:14px; color:#ffd966; font-size:1.3rem; font-weight:800; letter-spacing:2px; }
    .chips,.slot { display:flex; flex-wrap:wrap; gap:14px; }
    .chips { min-height:110px; }
    .chip,.word { min-width:115px; display:flex; flex-direction:column; align-items:center; gap:4px; border:2.5px solid #9b80ff; border-radius:36px; background:linear-gradient(145deg,#2e2054,#170f2e); color:white; cursor:pointer; box-shadow:0 6px 0 #0c0718,0 0 15px #a17eff88; }
    .chip { padding:12px 22px; }
    .chip.used { opacity:.25; pointer-events:none; }
    .pinyin { color:#ffe9a7; font-size:2rem; font-weight:800; line-height:1.15; }
    .hanzi { font-size:1.55rem; font-weight:700; }
    .slot { min-height:130px; align-items:center; margin-bottom:18px; padding:18px 20px; border:3px dashed #ffb347; border-radius:26px; background:#0b0720; }
    .placeholder { color:#9684bd; font-size:1.55rem; }
    .word { padding:10px 20px; border-color:#d4baff; border-radius:34px; background:#3f2d66; }
    .buttons { display:flex; flex-wrap:wrap; gap:12px; }
    button.action { border:2px solid #ffd96688; border-radius:60px; padding:14px 24px; background:#3a2b5e; color:#ffeac2; box-shadow:0 6px 0 #1a0f2e; cursor:pointer; font-size:1.25rem; font-weight:800; }
    button.primary { background:linear-gradient(145deg,#ffc857,#e09d1a); color:#1d0e2e; }
    .feedback { min-height:52px; margin-top:16px; font-size:1.4rem; font-weight:700; }
    .feedback.error { color:#ff9c9c; }
    .feedback.hint { color:#ffe082; }
    .mini { display:flex; flex-direction:column; min-height:360px; border-color:#ffb34755; }
    .minihead { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; padding-bottom:12px; border-bottom:1.5px solid #ffd96644; color:#ffd966; font-size:1.35rem; font-weight:800; }
    .mini-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
    .cards { width:min(380px,100%); display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .card { height:96px; border:2.5px solid #ffb347; border-radius:18px; background:#1f1338; color:#fff5d6; cursor:pointer; font-size:1.25rem; font-weight:800; }
    .card.matched { background:#2d5a2d; }
    .treasure { font-size:4.5rem; cursor:pointer; }
    .rocket { font-size:2.2rem; }
    @keyframes floaty { 50% { transform:translateY(-10px); } }
    .rocket.launched { display:inline-block; animation:floaty 1.5s infinite; }
    @media(max-width:950px) { .grid{grid-template-columns:1fr}.pinyin{font-size:1.75rem}h1{font-size:2.1rem}.panel{min-height:300px} }
  </style>
</head>
<body>
<div class="arena">
  <div class="header">
    <h1>✨ Mandarinwow · Blink-Blink Hub ✨</h1>
    <div class="subtitle">⚡ SIX REALMS ⚡</div>
  </div>

  <div class="intro">
    <span>👁️✨</span>
    <span>Arrange words to Mandarin!</span>
    <span>Flip cards · 西游记 · 寻宝 · 火星</span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-level="1">🟢 Level 1 · SVO</button>
    <button class="tab" data-level="2">🕒 Level 2 · S + Time + V + O</button>
    <button class="tab" data-level="3">📍 Level 3 · S + Time + Place + V + O</button>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="label"><span>🔤 Word Bank · 词库</span><span id="levelIndicator">Lv.1</span></div>
      <div id="wordBank" class="chips"></div>
      <div class="label" style="margin-top:20px"><span>📝 Arrange · 排列句子</span></div>
      <div id="sentenceSlot" class="slot"><span class="placeholder">点击词语… Tap words to build</span></div>
      <div class="buttons">
        <button type="button" class="action" id="clearBtn">🧹 清空 Clear</button>
        <button type="button" class="action" id="listenBtn">🔊 朗读 Listen</button>
        <button type="button" class="action primary" id="checkBtn">✅ 棡查 Check</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div class="panel mini">
      <div class="minihead"><span id="miniTitle">🃏 西游记 · 翻牌</span><span id="miniHint">Match characters</span></div>
      <div id="miniContent" class="mini-content"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const levels = {
    1: {
      hint:'💡 主语 (Subject) + 动词 (Verb) + 宾语 (Object)',
      sentences:[
        {accepted:['我吃苹果'],pinyin:'wǒ chī píngguǒ',words:['我|wǒ','吃|chī','苹果|píngguǒ']},
        {accepted:['他喝水'],pinyin:'tā hē shuǐ',words:['他|tā','喝|hē','水|shuǐ']},
        {accepted:['我们看电影'],pinyin:'wǒmen kàn diànyǐng',words:['我们|wǒmen','看|kàn','电影|diànyǐng']},
        {accepted:['妈妈做饭'],pinyin:'māma zuò fàn',words:['妈妈|māma','做|zuò','饭|fàn']},
        {accepted:['爸爸开车'],pinyin:'bàba kāi chē',words:['爸爸|bàba','开|kāi','车|chē']}
      ]
    },
    2: {
      hint:'💡 主语 (S) + 时间 (Time) + 动词 (V) + 宾语 (O)',
      sentences:[
        {accepted:['我今天吃苹果'],pinyin:'wǒ jīntiān chī píngguǒ',words:['我|wǒ','今天|jīntiān','吃|chī','苹果|píngguǒ']},
        {accepted:['他明天喝水'],pinyin:'tā míngtiān hē shuǐ',words:['他|tā','明天|míngtiān','喝|hē','水|shuǐ']},
        {accepted:['我们后天看电影'],pinyin:'wǒmen hòutiān kàn diànyǐng',words:['我们|wǒmen','后天|hòutiān','看|kàn','电影|diànyǐng']},
        {accepted:['妈妈昨天做饭'],pinyin:'māma zuótiān zuò fàn',words:['妈妈|māma','昨天|zuótiān','做|zuò','饭|fàn']},
        {accepted:['爸爸前天开车'],pinyin:'bàba qiántiān kāi chē',words:['爸爸|bàba','前天|qiántiān','开|kāi','车|chē']}
      ]
    },
    3: {
      hint:'💡 主语 (S) + 时间 (Time) + 地点 (Place) + 动词 (V) + 宾语 (O)',
      sentences:[
        {accepted:['我今天在学校吃苹果'],pinyin:'wǒ jīntiān zài xuéxiào chī píngguǒ',words:['我|wǒ','今天|jīntiān','在学校|zài xuéxiào','吃|chī','苹果|píngguǒ']},
        {accepted:['他明天在厨房喝水'],pinyin:'tā míngtiān zài chúfáng hē shuǐ',words:['他|tā','明天|míngtiān','在厨房|zài chúfáng','喝|hē','水|shuǐ']},
        {accepted:['我们后天在商场看电影'],pinyin:'wǒmen hòutiān zài shāngchǎng kàn diànyǐng',words:['我们|wǒmen','后天|hòutiān','在商场|zài shāngchǎng','看|kàn','电影|diànyǐng']},
        {accepted:['妈妈昨天在家里做饭'],pinyin:'māma zuótiān zài jiālǐ zuò fàn',words:['妈妈|māma','昨天|zuótiān','在家里|zài jiālǐ','做|zuò','饭|fàn']},
        {accepted:['爸爸前天在深圳开车'],pinyin:'bàba qiántiān zài shēnzhèn kāi chē',words:['爸爸|bàba','前天|qiántiān','在深圳|zài shēnzhèn','开|kāi','车|chē']}
      ]
    }
  };

  let level=1, index=0, chosen=[], used=new Set(), wrong=0, timer=null;
  const bank=document.querySelector('#wordBank'), slot=document.querySelector('#sentenceSlot'), feedback=document.querySelector('#feedback');

  function speak(text){ if(text&&'speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u);} }
  function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
  function setFeedback(text,type=''){feedback.textContent=text;feedback.className='feedback'+(type?' '+type:'')}
  function parsed(word){const [hanzi,pinyin]=word.split('|');return{hanzi,pinyin}}

  function resetMini(){ if(level===1)cards();else if(level===2)treasure();else rocket(); }
  function reset(){clearTimeout(timer);chosen=[];used=new Set();wrong=0;setFeedback('');renderBank();renderSlot();resetMini()}

  function renderBank(){
    bank.innerHTML='';
    const sentence=levels[level].sentences[index];
    const words=shuffle(sentence.words);
    words.forEach((raw,position)=>{
      const word=parsed(raw), chip=document.createElement('button');
      chip.type='button';chip.className='chip'+(used.has(position)?' used':'');chip.disabled=used.has(position);
      chip.innerHTML=`<span class="pinyin">${word.pinyin}</span><span class="hanzi">${word.hanzi}</span>`;
      chip.onclick=()=>{speak(word.hanzi);chosen.push({...word,position});used.add(position);renderBank();renderSlot();setFeedback('')};
      bank.appendChild(chip);
    });
  }

  function renderSlot(){
    slot.innerHTML='';
    if(!chosen.length){slot.innerHTML='<span class="placeholder">点击词语… Tap words to build</span>';return}
    chosen.forEach((word,i)=>{const el=document.createElement('button');el.type='button';el.className='word';el.innerHTML=`<span class="pinyin">${word.pinyin}</span><span class="hanzi">${word.hanzi}</span>`;el.onclick=()=>{clearTimeout(timer);const removed=chosen.splice(i,1)[0];used.delete(removed.position);renderBank();renderSlot();setFeedback('')};slot.appendChild(el)});
  }

  document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');level=+tab.dataset.level;index=0;document.querySelector('#levelIndicator').textContent='Lv.'+level;reset()});
  document.querySelector('#clearBtn').onclick=()=>reset();
  document.querySelector('#listenBtn').onclick=()=>{const s=levels[level].sentences[index];speak(chosen.length?s.accepted[0]:s.accepted[0])};
  document.querySelector('#checkBtn').onclick=()=>{
    clearTimeout(timer);const s=levels[level].sentences[index], answer=chosen.map(x=>x.hanzi).join(''), pinyin=chosen.map(x=>x.pinyin).join(' ');
    if(!chosen.length){setFeedback('⚠️ 请先点击词库里的词语！ Tap words first.','hint');return}
    if(s.accepted.includes(answer)){speak(answer);setFeedback(`✅ 正确！“${answer}” (${pinyin}) 太棒了！ ✨`);timer=setTimeout(()=>{index=(index+1)%s.accepted.length;reset()},1700)}
    else{wrong++;speak(answer);setFeedback(wrong===1?`❌ 再试试！ ${levels[level].hint}`:`❌ 正确参考： “${s.accepted[0]}” (${s.pinyin})`,wrong===1?'hint':'error')}
  };

  let cardState=null;
  function cards(){
    document.querySelector('#miniTitle').textContent='🃏 西游记 · 翻牌';document.querySelector('#miniHint').textContent='Match characters';
    if(!cardState){const data=shuffle(['🐒 孙悟空','🐖 猪八戒','👨‍🦲 唐僧','🐒 孙悟空','🐖 猪八戒','👨‍🦲 唐僧']);cardState={data,flipped:new Array(6).fill(false),matched:new Array(6).fill(false),open:[],locked:false}}
    const c=document.querySelector('#miniContent');c.innerHTML='';const box=document.createElement('div');box.className='cards';
    cardState.data.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.className='card'+(cardState.matched[i]?' matched':'');b.textContent=cardState.flipped[i]||cardState.matched[i]?text:'❓';b.onclick=()=>flip(i);box.appendChild(b)});c.appendChild(box);
    if(cardState.matched.every(Boolean)){const w=document.createElement('div');w.textContent='🎉 西游记胜利！';c.appendChild(w);const r=document.createElement('button');r.className='action primary';r.textContent='🔄 再玩一次';r.onclick=()=>{cardState=null;cards()};c.appendChild(r)}
  }
  function flip(i){const s=cardState;if(s.locked||s.matched[i]||s.flipped[i])return;s.flipped[i]=true;s.open.push(i);if(s.open.length===2){const[a,b]=s.open;if(s.data[a]===s.data[b]){s.matched[a]=s.matched[b]=true;s.open=[]}else{s.locked=true;cards();setTimeout(()=>{s.flipped[a]=s.flipped[b]=false;s.open=[];s.locked=false;cards()},600);return}}cards()}

  let treasure=false;
  function treasure(){document.querySelector('#miniTitle').textContent='☁️ 寻宝';document.querySelector('#miniHint').textContent='Tap the gift box';const c=document.querySelector('#miniContent');c.innerHTML='<div style="font-size:2rem">☁️ ☁️ ☁️ ☁️ ☁️</div>';const b=document.createElement('div');b.className='treasure';b.textContent=treasure?'🏆✨':'🎁❓';b.onclick=()=>{treasure=!treasure;c.innerHTML='';treasureGame()};c.appendChild(b);const m=document.createElement('div');m.textContent=treasure?'✨ 找到宝藏！ ✨':'Click the mystery box!';c.appendChild(m)}
  function treasureGame(){treasure()}

  let launched=false;
  function rocket(){document.querySelector('#miniTitle').textContent='🚀 火星 · 发射';document.querySelector('#miniHint').textContent='Launch to Mars';const c=document.querySelector('#miniContent');c.innerHTML='';const r=document.createElement('div');r.className='rocket';r.innerHTML=launched?'──────▶ <span class="rocket launched">🚀</span> 🔴 火星':'🚀 ────── 🔴 火星';c.appendChild(r);const b=document.createElement('button');b.className='action primary';b.textContent=launched?'🔄 Reset Rocket':'🔥 点火发射 Launch';b.onclick=()=>{launched=!launched;rocket()};c.appendChild(b);const m=document.createElement('div');m.textContent=launched?'🎉 成功抵达火星！':'Ready for liftoff!';c.appendChild(m)}

  reset();
})();
</script>
</body>
</html>
